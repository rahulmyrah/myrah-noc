server {
    listen 4000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options  "nosniff"      always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Serve client.config.json as API
    location = /api/config {
        default_type application/json;
        alias /usr/share/nginx/html/client.config.json;
        add_header Access-Control-Allow-Origin "*";
    }

    # Proxy to AI assistant backend
    location /api/ {
        proxy_pass http://noc-hub-api:4001/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_read_timeout 60s;
    }

    # Proxy to Uptime Kuma (WebSocket support for Socket.IO)
    location /proxy/uptime-kuma/ {
        proxy_pass http://myrah-uptime-kuma:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      "upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Proxy to Prometheus
    location /proxy/prometheus/ {
        proxy_pass http://myrah-prometheus:9090/;
        proxy_set_header Host            $host;
        proxy_read_timeout 30s;
    }

    # Proxy to Alertmanager
    location /proxy/alertmanager/ {
        proxy_pass http://myrah-alertmanager:9093/;
        proxy_set_header Host            $host;
        proxy_read_timeout 30s;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Docs sub-directory
    location /docs/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # Everything else — serve index.html
    location / {
        try_files $uri /index.html;
    }
}
